[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latam-evra-ocpi"
version = "0.4.0"
description = "Cliente Python no oficial para el Hub de roaming OCPI 2.3.0 de LATAM EV Roaming Alliance (LEA)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "LATAM EV Roaming Alliance" },
]
keywords = ["ocpi", "ev-charging", "roaming", "hub", "e-mobility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.urls]
Homepage = "https://latam-evra.org"
Repository = "https://github.com/latam-evra/latam-evra.org"

[tool.hatch.build.targets.wheel]
packages = ["src/latam_evra_ocpi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require the real local Hub running",
]
